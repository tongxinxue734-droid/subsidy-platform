services:
  backend:
    build: .
    container_name: subsidy-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-xian-subsidy-demo-secret-2026}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: subsidy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
