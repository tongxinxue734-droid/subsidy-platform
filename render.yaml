services:
  # 后端 FastAPI
  - type: web
    name: subsidy-backend
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        value: xian-subsidy-demo-secret-2026
      - key: DEEPSEEK_API_KEY
        value: ""

  # 前端 Vue（静态站点，免费，无需 plan）
  - type: web
    name: subsidy-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://subsidy-backend.onrender.com/api
